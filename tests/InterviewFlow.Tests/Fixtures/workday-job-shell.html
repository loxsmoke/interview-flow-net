    <meta name="description" property="og:description" content="Brooks is a leading provider of automation solutions with over 40 years of experience in the semiconductor industry, offering precision robotics, integrated automation systems, and contamination control solutions that empower chip manufacturers worldwide. Our product portfolio includes a range of automation solutions, including robots, vacuum systems, and atmospheric robots for semiconductor manufacturing (www.brooks.com). Are you looking for a place where you can be part of a transformation? Join us at Brooks Automation and be a part of a dynamic organization that is shaping the future of technology. Software Engineer - C# / Python (Contract Role) Job Description *** PLEASE NOTE THAT THIS IS AN ONSITE / CONTRACT POSITION BASED OUT OF OUR FREMONT, CA LOCATION, SO ONLY LOCAL CA CANDIDATES WILL BE CONSIDERED *** Brooks is a leading global provider of automation products and solutions for multiple markets including semiconductor manufacturing, life sciences, and clean energy. We are looking for a Contract Software Engineer as we accelerate our growth journey. This position will be an onsite role based out of our Fremont, CA, West Coast office. WHAT YOU&#39;LL DO: Gather requirements, write requirement specification, and review spec with project team. Propose design, write design specification, and review design with peers. Implement the design with the project’s chosen programming language(s) such as C#, Python. Review code with peer software engineers. Design and develop test cases for testing software. Integrate developed software components into system. Work with project team in testing, and in debugging system integration issues. Write release notes and application notes on new software features. Support customer adoption of software. Follow company’s software development process and product development process. WHAT YOU&#39;LL BRING: Bachelor’s Degree with a minimum of 2 years of professional software development experience OR a minimum of 6 years of professional software development experience. Professional software design experience on 2 projects. 1 year of professional software programming experience using C#. 1 year of professional software programming experience using Python. Knowledge of United Modeling Language (UML) in Object Oriented Analysis &amp;amp; Design. Experience in multi-threaded programming. Experience in network socket programming. Effective verbal and written communication skills. Work Location &amp;amp; Flexibility At Brooks, we aim to foster a collaborative and engaging environment while offering flexibility where possible. Work arrangements may include a mix of in-office and remote work, depending on the nature of the role and business needs. Specific expectations will be shared during the interview process. Brooks is committed to fostering a diverse and inclusive workplace and proudly serves as an equal-opportunity employer. We welcome all qualified applicants regardless of race, color, religion, gender identity or expression, sexual orientation, national origin, genetics, disability, age, veteran status, or any other legally protected characteristics. Diversity enhances our innovative capabilities and strengthens our ability to serve our customers and communities effectively. At Brooks Automation, we celebrate the unique experiences and perspectives each individual brings, believing they are essential to our collective success. Join us in building a workplace where every team member is valued and can thrive. For applicants with disabilities requiring accommodations, don&#39;t hesitate to get in touch with talentattraction@brooks.com or call +1 (978) 262-2400 to discuss your needs. Review EEO Law &amp;amp; EEO Statement. Brooks Automation participates in E-Verify® to confirm eligibility for employment in the United States. For more details, visit www.dhs.gov/E-Verify. E-Verify® is a registered trademark of the U.S. Department of Homeland Security. Since our founding in 1978, Brooks Automation has been a leading automation provider and trusted partner to the global manufacturing industry. Our customers choose the Brooks Automation platform because we consistently deliver best-in-class reliability and cost of ownership, with a solution that is optimized for value within their application. We deliver value through our understanding of the application challenge, providing solutions at scale that create an automated advantage for our customers. We are committed to innovation by continuously developing new product offerings and partnering with our customers to integrate solutions for their manufacturing process tools. This benefits our customers with improved throughput and yield and a lower cost of ownership.">
