name: CI

# Build + test on every push and PR. Both runners, because the whole point of
# the port is that it runs on Windows and macOS (docs/10-building.md).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore InterviewFlow.slnx

      - name: Build
        run: dotnet build InterviewFlow.slnx --configuration Release --no-restore

      # The UI tests are headless (Avalonia.Headless.XUnit) — no display needed.
      - name: Test
        run: dotnet test InterviewFlow.slnx --configuration Release --no-build --verbosity normal
